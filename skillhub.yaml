# Paths for skills and projects are relative to this file unless absolute.
settings:
  link_mode: auto

providers:
  codex:
    skill_dir: .codex/skills
  claude:
    skill_dir: .claude/skills
  antigravity:
    skill_dir: .agents/skills

skills:
  flow-docs:
    path: skills/flow-docs
  plan-docs:
    path: skills/plan-docs
  readme-docs:
    path: skills/readme-docs
  ui-semantic-locator:
    path: skills/ui-semantic-locator
  ui-control-protocol-create:
    path: skills/ui-control-protocol-create
  ui-control-protocol-update:
    path: skills/ui-control-protocol-update
  frontend-list:
    path: skills/frontend-list
  api-docs:
    path: skills/api-docs
  mes-backend-api:
    path: skills/mes-backend-api
  mes-backend-schema:
    path: skills/mes-backend-schema
  mes-frontend-ui:
    path: skills/mes-frontend-ui
  mes-frontend-tabbar:
    path: skills/mes-frontend-tabbar

projects:
  ai-massage:
    path: ${AI_MASSAGE_PROJECT}
    skills:
      - flow-docs
      - plan-docs
      - readme-docs
    providers:
      codex:
        enabled: true
      claude:
        enabled: false
      antigravity:
        enabled: false
  mes:
    path: ${MES_PROJECT}
    skills:
      - api-docs
      - flow-docs
      - frontend-list
      - plan-docs
      - readme-docs
      - ui-semantic-locator
      - ui-control-protocol-create
      - ui-control-protocol-update
      - mes-backend-api
      - mes-backend-schema
      - mes-frontend-ui
      - mes-frontend-tabbar
    providers:
      codex:
        enabled: true
      claude:
        enabled: false
      antigravity:
        enabled: false
  szwpower:
    path: ${SZWPOWER_PROJECT}
    skills:
      - flow-docs
      - plan-docs
      - readme-docs
    providers:
      codex:
        enabled: true
      claude:
        enabled: false
      antigravity:
        enabled: false
