# Project paths are relative to this file unless absolute.
# Skills are discovered from the immediate subdirectories of skills/.
settings:
  link_mode: auto

providers:
  codex:
    skill_dir: .codex/skills
  claude:
    skill_dir: .claude/skills
  antigravity:
    skill_dir: .agents/skills

projects:
  ai-massage:
    path: ${AI_MASSAGE_PROJECT}
    skills:
      - docs-flow
      - docs-plan
      - docs-readme
      - docker-production-standard
      - docker-develop-standard
      - docker-deployment-requirements
      - ai-massage-build-flash
      - ai-massage-comment-standards
      - ai-massage-laya-massage-intent
      - ai-massage-protocol-lingyang-board
      - ai-massage-protocol-ci1302
      - ai-massage-protocol-7ctft
      - ai-massage-release-deployment
      - ai-massage-utterance-normalizer
      - op-ssh-key
    providers:
      codex:
        enabled: true
      claude:
        enabled: false
      antigravity:
        enabled: false
  mes:
    path: ${MES_PROJECT}
    skills:
      - docs-flow
      - docs-plan
      - docs-readme
      - ui-semantic-locator
