# Project paths are relative to this file unless absolute.
# Skills are discovered from the immediate subdirectories of source/skills/.
settings:
  link_mode: auto

providers:
  codex:
    skill_dir: .codex/skills
    rule_index_dir: .codex/rules
    rule_dir: AGENTS.md
  claude:
    skill_dir: .claude/skills
    rule_index_dir: .claude/rules
    rule_dir: CLAUDE.md
  antigravity:
    skill_dir: .agents/skills
    rule_index_dir: .agents/rules
    rule_dir: GEMINI.md

projects:
  ai-massage:
    path: ${AI_MASSAGE_PROJECT}
    skills:
      - docs-flow
      - docs-plan
      - docs-readme
      - docker-production-standard
      - docker-develop-standard
      - docker-deployment-requirements
      - ai-massage-build-flash
      - ai-massage-comment-standards
      - ai-massage-laya-massage-intent
      - ai-massage-protocol-lingyang-board
      - ai-massage-protocol-ci1302
      - ai-massage-protocol-7ctft
      - ai-massage-release-deployment
      - ai-massage-utterance-normalizer
      - op-item-get
    rules:
      - ai-massage
      - pen
    rule_index:
      - python-code-style
      - python-comment-standards
      - python-import-standards
    providers:
      codex:
        enabled: true
      claude:
        enabled: false
      antigravity:
        enabled: false
